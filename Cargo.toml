[package]
name = "minidock"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
libc = "0.2"
nix = { version = "0.27", features = ["fs", "hostname", "mount", "process", "sched", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
time = { version = "=0.3.36", features = ["formatting", "macros", "parsing", "serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
